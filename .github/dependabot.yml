version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # requirements.txt holds minimum versions. Only open a pull request when
    # a new release falls outside the allowed range, not to raise the floor.
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
