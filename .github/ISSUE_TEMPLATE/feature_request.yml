name: Feature request
description: Something ARGUS should notice, do or show.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to get done, and where does ARGUS fall short today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Does it record anything new, or send anything off the machine? ARGUS is local-first, so this decides a lot.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
